name: iOS Simulator Build
on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: xcode-27
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build iOS app
        run: |
          xcodebuild -project VercelManager.xcodeproj \
            -scheme VercelManager \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build
